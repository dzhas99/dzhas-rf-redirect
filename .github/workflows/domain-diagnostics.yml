name: Domain diagnostics

on:
  push:
    paths:
      - ".github/workflows/domain-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check DNS TLS and Pages state
        shell: bash
        run: |
          set -u
          DOMAIN="xn--80ahg9b.xn--p1ai"
          echo "===== A ====="
          dig +short A "$DOMAIN" || true
          echo "===== AAAA ====="
          dig +short AAAA "$DOMAIN" || true
          echo "===== CNAME ====="
          dig +short CNAME "$DOMAIN" || true
          echo "===== CAA ====="
          dig +short CAA "$DOMAIN" || true
          echo "===== NS ====="
          dig +short NS "$DOMAIN" || true
          echo "===== TLS CERTIFICATE ====="
          echo | openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" -showcerts 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || true
          echo "===== REAPPLY CUSTOM DOMAIN VIA API ====="
          curl -sS -i -L -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/dzhas99/dzhas-rf-redirect/pages" \
            -d '{"cname":"xn--80ahg9b.xn--p1ai"}' || true
          echo
          sleep 3
          echo "===== GITHUB PAGES API ====="
          curl -sS -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/dzhas99/dzhas-rf-redirect/pages" || true
          echo
          echo "===== HTTPS HEAD ====="
          curl -vkI --max-time 20 "https://$DOMAIN/" 2>&1 | sed -n '1,120p' || true
